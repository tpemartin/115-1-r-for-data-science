        const { useState, useEffect, useMemo } = React;
        const h = React.createElement;

        const App = () => {
            const [users, setUsers] = useState([]);
            const [selectedId, setSelectedId] = useState("");
            
            // Function to parse the raw string
            useEffect(() => {
                const parsedData = rawDataString
                    .trim()
                    .split('\n')
                    .map((line, index) => {
                        // Regex explanation:
                        // \((\d+)\) -> Capture ID number inside parentheses
                        // \s* -> Allow whitespace
                        // (.*?) -> Capture name (non-greedy)
                        // (https:\/\/.*) -> Capture URL
                        const match = line.match(/\((\d+)\)\s*(.*?)(https?:\/\/.*)/);
                        if (match) {
                            return {
                                uniqueKey: index, // React requires a unique key
                                id: match[1],
                                name: match[2].trim(),
                                url: match[3].trim()
                            };
                        }
                        return null;
                    })
                    .filter(item => item !== null);
                
                // Sort by ID for easier finding
                parsedData.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                setUsers(parsedData);
            }, []);

            const selectedUser = useMemo(() => {
                return users.find(u => u.uniqueKey.toString() === selectedId);
            }, [selectedId, users]);

            return h(
                "div",
                { className: "min-h-screen flex items-center justify-center p-4" },
                h(
                    "div",
                    { className: "bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden border border-gray-100" },
                    h(
                        "div",
                        { className: "bg-green-600 p-6 text-center" },
                        h(
                            "h1",
                            { className: "text-2xl font-bold text-white mb-2" },
                            h("i", { className: "ph ph-link-simple mr-2" }),
                            "Assessment Link Lookup"
                        ),
                        h(
                            "p",
                            { className: "text-green-100 text-sm" },
                            "Select your ID or Name to get the link"
                        )
                    ),
                    h(
                        "div",
                        { className: "p-6 space-y-6" },
                        h(
                            "div",
                            { className: "space-y-2" },
                            h(
                                "label",
                                {
                                    htmlFor: "user-select",
                                    className: "block text-sm font-medium text-gray-700"
                                },
                                "Select ID / Name"
                            ),
                            h(
                                "div",
                                { className: "relative" },
                                h(
                                    "select",
                                    {
                                        id: "user-select",
                                        value: selectedId,
                                        onChange: (e) => setSelectedId(e.target.value),
                                        className: "block w-full pl-3 pr-10 py-3 text-base border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 sm:text-sm rounded-lg transition-shadow"
                                    },
                                    h("option", { value: "", disabled: true }, "-- Select --"),
                                    users.map((user) =>
                                        h(
                                            "option",
                                            { key: user.uniqueKey, value: String(user.uniqueKey) },
                                            `(${user.id}) ${user.name}`
                                        )
                                    )
                                ),
                                h(
                                    "div",
                                    { className: "pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700" },
                                    h("i", { className: "ph ph-caret-down text-lg" })
                                )
                            )
                        ),
                        selectedUser
                            ? h(
                                  "div",
                                  { className: "transition-all duration-300 ease-in-out opacity-100 translate-y-0" },
                                  h(
                                      "div",
                                      { className: "bg-green-50 rounded-xl p-5 border border-green-100 text-center space-y-4" },
                                      h(
                                          "div",
                                          { className: "space-y-1" },
                                          h(
                                              "div",
                                              { className: "text-xs font-semibold text-green-500 tracking-wide uppercase" },
                                              `ID: ${selectedUser.id}`
                                          ),
                                          h(
                                              "div",
                                              { className: "text-xl font-bold text-gray-900" },
                                              selectedUser.name
                                          )
                                      ),
                                      h(
                                          "a",
                                          {
                                              href: selectedUser.url,
                                              target: "_blank",
                                              rel: "noopener noreferrer",
                                              className: "inline-flex items-center justify-center w-full px-5 py-3 text-base font-medium text-white bg-green-600 hover:bg-green-700 rounded-lg shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5"
                                          },

                        h("span", null, `Total records: ${users.length}`),
                        h("span", null, "System Ready")
                    )
                )
            );
        };
